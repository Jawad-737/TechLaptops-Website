<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart - TechLaptops</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="cart-container">

        
    <a href="index.php" class="home-btn">

       <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" width="20" height="20">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
      d="M3 9.75L12 3l9 6.75V21a.75.75 0 01-.75.75H4.75A.75.75 0 014 21V9.75z" />
       </svg>
    
    </a>

    <h2>Your Shopping Cart</h2>
    <div id="cart-items"></div>
  <div class="cart-bottom">
  <div id="total" class="total-box">Total: $0</div>
  <button id="checkout-btn">Proceed to Checkout</button>
</div>
  </div>

  <script>
    const cartItemsEl = document.getElementById("cart-items");
    const totalEl = document.getElementById("total");

   
    const productPrices = {
      "HP Victus 15": 850,
      "Lenovo LOQ 15": 950,
      "Adidas Laptop Bag": 100,
      "Adidas Shoes": 80
    };

    function renderCart() {
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      cartItemsEl.innerHTML = "";
      let total = 0;

      if (cart.length === 0) {
        cartItemsEl.innerHTML = "<p>Your cart is empty.</p>";
        totalEl.style.display = "none";
        return;
      }

      totalEl.style.display = "block";

      cart.forEach((item, index) => {
        const price = productPrices[item] || 0;
        total += price;
        const div = document.createElement("div");
        div.className = "cart-item";
        div.innerHTML = `
          <span>${item}</span>
          <span>$${price}</span>
          <button onclick="removeItem(${index})">Remove</button>
        `;
        cartItemsEl.appendChild(div);
      });

      totalEl.textContent = `Total: $${total}`;
    }

    function removeItem(index) {
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      cart.splice(index, 1);
      localStorage.setItem("cart", JSON.stringify(cart));
      renderCart();
    }

    renderCart();

    document.getElementById("checkout-btn").addEventListener("click", () => {
  const cart = JSON.parse(localStorage.getItem("cart")) || [];
  if (cart.length === 0) {
    alert("Your cart is empty!");
    return;
  }

  alert("Thank you for your purchase! Checkout complete.");
  localStorage.removeItem("cart");
  renderCart(); 
});
  </script>
</body>
</html>
